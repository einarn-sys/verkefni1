    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samband</title>
</head>

<body>

    <header>
        <h1>Samband</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Heim</a></li>

        </ul>

    <main>
        <h2>Hafðu samband við okkur</h2>

        <p>
            Ef þú hefur spurningar um ferðir okkar eða vilt fá frekari
            upplýsingar getur þú haft samband við okkur með því að fylla út
            formið hér að neðan.
        </p>

        <form>
            <p>
                <label for="nafn">Nafn:</label>
                <input type="text" id="nafn" name="nafn">
            </p>

            <p>
                <label for="netfang">Netfang:</label>
                <input type="email" id="netfang" name="netfang">
            </p>

            <p>
                <label for="simanumer">Símanúmer:</label>
                <input type="tel" id="simanumer" name="simanumer">
            </p>

            <p>
                <label for="skilabod">Skilaboð:</label>
                <textarea id="skilabod" name="skilabod"></textarea>
            </p>

            <button type="submit">Senda</button>
        </form>
    </main>
